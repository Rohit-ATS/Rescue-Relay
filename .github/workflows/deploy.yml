name: Deploy RescueRelay to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Determine Base Path
        id: base-path
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE" ]; then
            echo "base_path=/" >> $GITHUB_OUTPUT
          else
            [[ "$BASE" != /* ]] && BASE="/$BASE"
            [[ "$BASE" != */ ]] && BASE="$BASE/"
            echo "base_path=$BASE" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build static site for GitHub Pages
        working-directory: frontend
        env:
          BASE_PATH: ${{ steps.base-path.outputs.base_path }}
          VITE_BASE_PATH: ${{ steps.base-path.outputs.base_path }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rwvjkzpugmlrmcdgltwu.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_dxH-ZdsppAxtwjA1A9NBAQ_ofTIuX3m' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'rwvjkzpugmlrmcdgltwu' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rwvjkzpugmlrmcdgltwu.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_dxH-ZdsppAxtwjA1A9NBAQ_ofTIuX3m' }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'rwvjkzpugmlrmcdgltwu' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY || secrets.VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY || secrets.VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_TRACKING_ID: ${{ secrets.VITE_LOVABLE_CONNECTOR_GOOGLE_MAPS_TRACKING_ID }}
        run: bun run build:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
